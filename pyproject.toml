[project]
name = "astrbot-plugin-anime-party-33989"
version = "0.1.2"
description = "Deterministic Emoji anime guessing game for AstrBot"
requires-python = ">=3.11"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 110

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
